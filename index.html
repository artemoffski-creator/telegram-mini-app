<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Приёмка и Отчетность</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #f4f5f7; color: #333; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: #e0e0e0; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #007bff; color: #fff; }
    .content-block { display: none; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .content-block.active { display: block; }
    label { font-weight: 600; display: block; margin-top: 10px; margin-bottom: 4px; font-size: 13px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .filter-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .filter-grid { display: flex; gap: 8px; }
    .filter-grid > div { flex: 1; }
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    button.action-btn { flex: 1; padding: 10px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
    button.refresh-btn { background: #007bff; color: white; }
    button.export-btn { background: #28a745; color: white; }
    button.submit-btn { width: 100%; margin-top: 18px; padding: 12px; background: #007bff; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #a5a5a5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f1f3f5; }
    .preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .preview-thumb { width: 65px; height: 65px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('intake')">Приёмка</button>
    <button class="tab-btn" onclick="switchTab('report')">Отчёт</button>
  </div>

  <!-- ВКЛАДКА: ПРИЁМКА -->
  <div id="tab-intake" class="content-block active">
    <form id="intakeForm" onsubmit="handleFormSubmit(event)">
      <label for="formDocSelect">Номер документа (НЕ принятые):</label>
      <select id="formDocSelect" required>
        <option value="">Загрузка списка...</option>
      </select>

      <label for="formGroup">Маркировка / Группа:</label>
      <input type="text" id="formGroup" placeholder="Введите маркировку">

      <label for="formPallets">Паллеты:</label>
      <input type="number" id="formPallets" value="0" min="0">

      <label for="formBox15">Коробки 15 кг:</label>
      <input type="number" id="formBox15" value="0" min="0">

      <label for="formBox25">Коробки 25 кг:</label>
      <input type="number" id="formBox25" value="0" min="0">

      <label for="formComment">Комментарий:</label>
      <textarea id="formComment" rows="2" placeholder="Дополнительная информация"></textarea>

      <label for="formPhotoFile">Прикрепить фото:</label>
      <input type="file" id="formPhotoFile" accept="image/*" capture="environment" multiple onchange="handleMultiplePhotos()">
      
      <div id="photosPreviewContainer" class="preview-container"></div>

      <button type="submit" id="submitBtn" class="submit-btn">✅ Сохранить приёмку</button>
    </form>
  </div>

  <!-- ВКЛАДКА: ОТЧЕТ -->
  <div id="tab-report" class="content-block">
    <div class="filter-card">
      <div class="filter-grid">
        <div>
          <label for="filterDateFrom">Дата с:</label>
          <input type="date" id="filterDateFrom" onchange="applyFilters()">
        </div>
        <div>
          <label for="filterDateTo">Дата по:</label>
          <input type="date" id="filterDateTo" onchange="applyFilters()">
        </div>
      </div>
      <div class="btn-group">
        <button class="action-btn refresh-btn" onclick="loadReportData()">🔄 Обновить</button>
        <button class="action-btn export-btn" onclick="exportToExcel()">📥 Скачать Excel</button>
      </div>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>Дата</th>
          <th>Документ</th>
          <th>Группа</th>
          <th>Паллеты</th>
        </tr>
      </thead>
      <tbody id="reportTableBody">
        <tr><td colspan="4">Нажмите «Обновить» для загрузки данных</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ⚠️ ВАЖНО: Вставьте сюда реальную URL из Web App Deployment (должна заканчиваться на /exec)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_GKMWf4NcaM6pyy-mJmTAIM4is1bG73vhBq8PeYytMvAQk70CLuSHXQqWQM-aMkQ/exec";
    
    let base64PhotosArray = []; 
    let rawReportData = []; 
    let filteredReportData = []; 

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    document.addEventListener("DOMContentLoaded", function() {
      loadIntakeDocs();
    });

// Замена функции apiPost на отправку через скрытый iframe
function apiPost(payload) {
  return new Promise((resolve, reject) => {
    const iframeName = 'gas_iframe_' + Date.now();
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = SCRIPT_URL; // Ссылка на ваш /exec
    form.target = iframeName;

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'postData';
    input.value = JSON.stringify(payload);
    form.appendChild(input);

    document.body.appendChild(form);

    // Слушаем завершение загрузки iframe
    iframe.onload = () => {
      setTimeout(() => {
        document.body.removeChild(form);
        document.body.removeChild(iframe);
      }, 500);
      resolve({ status: "success" });
    };

    iframe.onerror = (err) => {
      reject(err);
    };

    form.submit();
  });
}





    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.content-block').forEach(blk => blk.classList.remove('active'));

      if (tabName === 'intake') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-intake').classList.add('active');
        loadIntakeDocs();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-report').classList.add('active');
        loadReportData();
      }
    }

    async function loadIntakeDocs() {
      const select = document.getElementById('formDocSelect');
      select.innerHTML = '<option value="">Загрузка...</option>';

      try {
        const data = await apiPost({ action: "getDocs" });
        select.innerHTML = '<option value="">-- Выберите документ --</option>';

        if (data.docs && data.docs.length > 0) {
          data.docs.forEach(doc => {
            const opt = document.createElement('option');
            opt.value = doc;
            opt.textContent = doc;
            select.appendChild(opt);
          });
        } else {
          select.innerHTML = '<option value="">Нет доступных документов</option>';
        }
      } catch (err) {
        select.innerHTML = '<option value="">Ошибка загрузки списка</option>';
      }
    }

    function handleMultiplePhotos() {
      const files = document.getElementById('formPhotoFile').files;
      const container = document.getElementById('photosPreviewContainer');
      container.innerHTML = '';
      base64PhotosArray = [];

      if (!files || files.length === 0) return;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          base64PhotosArray.push(e.target.result);
          const img = document.createElement('img');
          img.src = e.target.result;
          img.className = 'preview-thumb';
          container.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const docSelect = document.getElementById('formDocSelect').value;
      if (!docSelect) return alert("Выберите документ!");

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Сохранение...";

      const payload = {
        action: "saveIntake",
        docNum: docSelect,
        group: document.getElementById('formGroup').value,
        pallets: document.getElementById('formPallets').value,
        box15: document.getElementById('formBox15').value,
        box25: document.getElementById('formBox25').value,
        comment: document.getElementById('formComment').value,
        photos: base64PhotosArray
      };

      try {
        const res = await apiPost(payload);
        if (res.status === "success") {
          alert("Приёмка успешно сохранена!");
          document.getElementById('intakeForm').reset();
          document.getElementById('photosPreviewContainer').innerHTML = "";
          base64PhotosArray = [];
          switchTab('report');
        } else {
          alert("Ошибка: " + res.message);
        }
      } catch (err) {
        alert("Ошибка сети: " + err);
      } finally {
        btn.disabled = false;
        btn.innerText = "✅ Сохранить приёмку";
      }
    }

    async function loadReportData() {
      const tbody = document.getElementById('reportTableBody');
      tbody.innerHTML = '<tr><td colspan="4">Загрузка данных...</td></tr>';

      try {
        const result = await apiPost({ action: "getReportData" });
        if (result.data && result.data.length > 0) {
          rawReportData = result.data;
          applyFilters();
        } else {
          rawReportData = [];
          filteredReportData = [];
          tbody.innerHTML = '<tr><td colspan="4">Нет принятых документов</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4">Ошибка загрузки отчета</td></tr>';
      }
    }

    function applyFilters() {
      const dateFrom = document.getElementById('filterDateFrom').value;
      const dateTo = document.getElementById('filterDateTo').value;

      filteredReportData = rawReportData.filter(item => {
        if (!item.date) return true;
        if (dateFrom && item.date < dateFrom) return false;
        if (dateTo && item.date > dateTo) return false;
        return true;
      });

      renderReportTable(filteredReportData);
    }

    function renderReportTable(data) {
      const tbody = document.getElementById('reportTableBody');
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">За выбранный период данные не найдены</td></tr>';
        return;
      }

      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.date || '—'}</td>
          <td>${row.docNum}</td>
          <td>${row.group || '—'}</td>
          <td>${row.pallets || 0}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportToExcel() {
      if (!filteredReportData || filteredReportData.length === 0) {
        return alert("Нет данных для выгрузки!");
      }

      const excelRows = filteredReportData.map(item => ({
        "Дата": item.date || "—",
        "Номер документа": item.docNum,
        "Группа": item.group || "—",
        "Паллеты": item.pallets || 0
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Отчет");
      XLSX.writeFile(workbook, `Report_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }
  </script>
</body>
</html>
