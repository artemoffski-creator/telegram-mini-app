<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Mini App — Приёмка</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Eruda для отладки на мобильных устройствах -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    select, input[type="text"], input[type="file"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000000);
    }

    button.btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button.btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

  <h2>Оформление приёмки</h2>

  <form id="intakeForm">
    <div class="form-group">
      <label for="formDocSelect">Номер документа:</label>
      <select id="formDocSelect" required>
        <option value="">Загрузка списка...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="commentInput">Комментарий:</label>
      <textarea id="commentInput" rows="3" placeholder="Введите примечание..."></textarea>
    </div>

    <div class="form-group">
      <label for="photoInput">Фотография:</label>
      <input type="file" id="photoInput" accept="image/*">
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Сохранить приёмку</button>
  </form>

  <div id="statusMessage"></div>

  <script>
    // ------------------------------------------------------------------
    // ВАЖНО: Замените эту ссылку на актуальный URL вашего Web App в GAS!
    // ------------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_GKMWf4NcaM6pyy-mJmTAIM4is1bG73vhBq8PeYytMvAQk70CLuSHXQqWQM-aMkQ/exec";

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand(); // Разворачиваем Mini App на весь экран
    }

    // --- API 1: GET-запросы (чтение данных без CORS-блокировок) ---
    async function apiGet(action) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=${action}`, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });
        return await response.json();
      } catch (error) {
        console.error(`Ошибка apiGet (${action}):`, error);
        return { status: "error", message: error.toString() };
      }
    }

    // --- API 2: POST-запросы (отправка формы через скрытый iframe) ---
    function apiPost(payload) {
      return new Promise((resolve, reject) => {
        const iframeName = 'gas_iframe_' + Date.now();
        const iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = SCRIPT_URL;
        form.target = iframeName;

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'postData';
        input.value = JSON.stringify(payload);
        form.appendChild(input);

        document.body.appendChild(form);

        iframe.onload = () => {
          setTimeout(() => {
            if (document.body.contains(form)) document.body.removeChild(form);
            if (document.body.contains(iframe)) document.body.removeChild(iframe);
          }, 500);
          resolve({ status: "success" });
        };

        iframe.onerror = (err) => {
          reject(err);
        };

        form.submit();
      });
    }

    // --- Загрузка списка документов ---
    async function loadIntakeDocs() {
      const select = document.getElementById('formDocSelect');
      if (!select) return;

      select.innerHTML = '<option value="">Загрузка...</option>';

      try {
        const data = await apiGet("getDocs");

        if (data && data.status === "success" && Array.isArray(data.docs) && data.docs.length > 0) {
          select.innerHTML = '<option value="">-- Выберите документ --</option>';
          
          data.docs.forEach(doc => {
            const opt = document.createElement('option');
            opt.value = doc;
            opt.textContent = doc;
            select.appendChild(opt);
          });
        } else if (data && data.status === "error") {
          select.innerHTML = `<option value="">Ошибка: ${data.message || 'Сбой сервера'}</option>`;
        } else {
          select.innerHTML = '<option value="">Нет доступных документов</option>';
        }
      } catch (err) {
        console.error("Ошибка в loadIntakeDocs:", err);
        select.innerHTML = '<option value="">Ошибка загрузки списка</option>';
      }
    }

    // --- Конвертация файла в Base64 ---
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]); // Отсекаем 'data:image/...;base64,'
        reader.onerror = error => reject(error);
      });
    }

    // --- Обработка отправки формы ---
    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('statusMessage');
      const docNum = document.getElementById('formDocSelect').value;
      const comment = document.getElementById('commentInput').value;
      const photoFile = document.getElementById('photoInput').files[0];

      if (!docNum) {
        showStatus("Выберите документ из списка!", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Сохранение...";
      statusDiv.style.display = "none";

      try {
        let photoBase64 = "";
        let photoName = "";

        if (photoFile) {
          photoBase64 = await fileToBase64(photoFile);
          photoName = photoFile.name;
        }

        const payload = {
          action: "saveIntake",
          docNum: docNum,
          comment: comment,
          photo: photoBase64,
          photoName: photoName,
          user: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name : "WebUser"
        };

        await apiPost(payload);
        showStatus("Приёмка успешно сохранена!", "success");

        // Очистка формы и обновление списка
        document.getElementById('intakeForm').reset();
        loadIntakeDocs();

      } catch (err) {
        console.error("Ошибка сохранения:", err);
        showStatus("Ошибка при отправке данных", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Сохранить приёмку";
      }
    });

    function showStatus(text, type) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.textContent = text;
      statusDiv.className = type === "success" ? "status-success" : "status-error";
      statusDiv.style.display = "block";
    }

    // --- Автозапуск при загрузке DOM ---
    document.addEventListener('DOMContentLoaded', () => {
      loadIntakeDocs();
    });
  </script>
</body>
</html>
