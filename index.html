<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMA Cargo System</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f4f7; margin: 0; padding: 12px; color: #333; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px; background: #e3e3e8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #555; }
    .tab-btn.active { background: #007aff; color: #fff; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .controls { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .btn-group { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
    .btn-group button { border: 1px solid #007aff; background: #fff; color: #007aff; padding: 6px 12px; border-radius: 8px; font-size: 13px; white-space: nowrap; cursor: pointer; }
    .btn-group button.active { background: #007aff; color: #fff; }
    
    .select-row { display: flex; gap: 8px; margin-bottom: 8px; }
    select, input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: #fff; margin-bottom: 10px; }
    
    .excel-btn { width: 100%; background: #34c759; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .submit-btn { width: 100%; background: #007aff; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .submit-btn:disabled { background: #ccc; }

    .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .card-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 6px; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; }
    .badge { background: #e5f1ff; color: #007aff; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .card-body { font-size: 13px; color: #444; line-height: 1.5; }
    .loader { text-align: center; padding: 20px; color: #777; font-size: 14px; }
    label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }

    #photoPreview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('report')">📋 Отчёт</button>
    <button class="tab-btn" onclick="switchTab('intake')">📦 Приёмка</button>
  </div>

  <!-- ВКЛАДКА 1: ОТЧЕТ -->
  <div id="tab-report" class="tab-content active">
    <div class="controls">
      <div class="btn-group">
        <button onclick="setPeriod('all', this)" class="active">Все</button>
        <button onclick="setPeriod('current_week', this)">Тек. неделя</button>
        <button onclick="setPeriod('last_week', this)">Прошлая неделя</button>
        <button onclick="setPeriod('month', this)">Месяц</button>
      </div>

      <div class="select-row" id="monthContainer" style="display:none;">
        <select id="monthSelect" onchange="loadData()"></select>
      </div>

      <div class="select-row">
        <select id="vesselSelect" onchange="renderData()">
          <option value="">Все суда</option>
        </select>
      </div>

      <button class="excel-btn" onclick="exportToExcel()">📊 Скачать в Excel (.xlsx)</button>
    </div>

    <div id="dataList" class="loader">Загрузка данных...</div>
  </div>

  <!-- ВКЛАДКА 2: ФОРМА ПРИЁМКИ -->
  <div id="tab-intake" class="tab-content">
    <div class="controls">
      <form id="intakeForm" onsubmit="handleFormSubmit(event)">
        
        <label>Выберите номер документа (из Реестра):</label>
        <select id="formDocSelect" required>
          <option value="">Загрузка документов из Реестра...</option>
        </select>

        <label>Маркировка / Группа:</label>
        <input type="text" id="formGroup" placeholder="Например: CELST-123">

        <label>Паллеты (шт):</label>
        <input type="number" id="formPallets" value="0" min="0" step="any">

        <label>Коробки 15кг (шт):</label>
        <input type="number" id="formBox15" value="0" min="0" step="any">

        <label>Коробки 25кг (шт):</label>
        <input type="number" id="formBox25" value="0" min="0" step="any">

        <label>Сделать / прикрепить фото:</label>
        <input type="file" id="formPhotoFile" accept="image/*" capture="environment" onchange="previewFile()">
        <img id="photoPreview" alt="Превью фото">

        <label>Комментарий:</label>
        <textarea id="formComment" rows="2" placeholder="Примечание по грузу..."></textarea>

        <button type="submit" id="submitBtn" class="submit-btn">✅ Сохранить приёмку</button>
      </form>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLVZ-hbSIJ1DuJARE4-Y_y-hERSGpQJg0eoIfxSza5-5Gzy1VTF_zUUauBMtzwzW8a/exec"; 

    let currentPeriod = 'all';
    let rawItems = [];
    let vesselsList = [];
    let docsList = [];
    let base64Photo = "";

    function initMonths() {
      const select = document.getElementById('monthSelect');
      select.innerHTML = '';
      const now = new Date();
      for (let i = 0; i < 12; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const name = d.toLocaleString('ru', { month: 'long', year: 'numeric' });
        select.innerHTML += `<option value="${val}">${name}</option>`;
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (tab === 'report') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-report').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-intake').classList.add('active');
      }
    }

    function setPeriod(p, btn) {
      currentPeriod = p;
      document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      document.getElementById('monthContainer').style.display = (p === 'month') ? 'flex' : 'none';
      loadData();
    }

    function previewFile() {
      const file = document.getElementById('formPhotoFile').files[0];
      const preview = document.getElementById('photoPreview');
      const reader = new FileReader();

      reader.addEventListener("load", function () {
        preview.src = reader.result;
        preview.style.display = "block";
        base64Photo = reader.result;
      }, false);

      if (file) reader.readAsDataURL(file);
    }

    async function loadData() {
      document.getElementById('dataList').innerHTML = "Загрузка данных...";
      let url = `${SCRIPT_URL}?period=${currentPeriod}`;
      if (currentPeriod === 'month') {
        url += `&month=${document.getElementById('monthSelect').value}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
          document.getElementById('dataList').innerHTML = `<div class='loader'>Ошибка: ${data.error}</div>`;
          return;
        }

        rawItems = data.items || [];
        vesselsList = data.vessels || [];
        docsList = data.docs || [];

        updateVesselsDropdown();
        updateDocsDropdown();
        renderData();
      } catch (e) {
        document.getElementById('dataList').innerHTML = "<div class='loader'>Ошибка загрузки. Проверьте SCRIPT_URL</div>";
      }
    }

    function updateVesselsDropdown() {
      const select = document.getElementById('vesselSelect');
      const selected = select.value;
      select.innerHTML = '<option value="">Все суда</option>';
      vesselsList.forEach(v => {
        select.innerHTML += `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`;
      });
    }

    function updateDocsDropdown() {
      const select = document.getElementById('formDocSelect');
      select.innerHTML = '<option value="">-- Выберите документ из Реестра --</option>';
      if (docsList.length === 0) {
        select.innerHTML = '<option value="">Документы в Реестре не найдены</option>';
        return;
      }
      docsList.forEach(d => {
        select.innerHTML += `<option value="${d}">${d}</option>`;
      });
    }

    function renderData() {
      const selectedVessel = document.getElementById('vesselSelect').value;
      const filtered = rawItems.filter(item => !selectedVessel || item.vessel === selectedVessel);

      if (filtered.length === 0) {
        document.getElementById('dataList').innerHTML = "<div class='loader'>Записей не найдено</div>";
        return;
      }

      let html = '';
      filtered.forEach(item => {
        html += `
          <div class="card">
            <div class="card-header">
              <span>🚢 ${item.vessel}</span>
              <span class="badge">${item.status}</span>
            </div>
            <div class="card-body">
              <b>Документ:</b> ${item.doc}<br>
              <b>Дата:</b> ${item.date}<br>
              <b>Паллеты:</b> ${item.pallets} | <b>15кг:</b> ${item.box15} | <b>25кг:</b> ${item.box25}<br>
              ${item.comment ? `<b>Коммент:</b> ${item.comment}<br>` : ''}
              ${item.photo ? `<a href="${item.photo}" target="_blank" style="color:#007aff;">📷 Фото</a>` : ''}
            </div>
          </div>
        `;
      });
      document.getElementById('dataList').innerHTML = html;
    }

    function exportToExcel() {
      const selectedVessel = document.getElementById('vesselSelect').value;
      const filtered = rawItems.filter(item => !selectedVessel || item.vessel === selectedVessel);

      if (filtered.length === 0) {
        alert("Нет данных для экспорта!");
        return;
      }

      const excelData = filtered.map(i => ({
        "Судно": i.vessel,
        "Документ / Маркировка": i.doc,
        "Группа": i.group,
        "Статус": i.status,
        "Дата приёмки": i.date,
        "Паллеты": i.pallets,
        "Коробки 15кг": i.box15,
        "Коробки 25кг": i.box25,
        "Комментарий": i.comment,
        "Ссылка на фото": i.photo
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Приёмка");

      XLSX.writeFile(workbook, `Отчет_Приемка_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const docSelect = document.getElementById('formDocSelect').value;
      if (!docSelect) {
        alert("Выберите номер документа!");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Сохранение...";

      const payload = {
        docNum: docSelect,
        group: document.getElementById('formGroup').value,
        pallets: document.getElementById('formPallets').value,
        box15: document.getElementById('formBox15').value,
        box25: document.getElementById('formBox25').value,
        comment: document.getElementById('formComment').value,
        photoBase64: base64Photo
      };

      try {
        await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
        alert("Приёмка успешно сохранена!");
        document.getElementById('intakeForm').reset();
        document.getElementById('photoPreview').style.display = "none";
        base64Photo = "";
        
        switchTab('report');
        loadData();
      } catch (err) {
        alert("Ошибка при сохранении!");
      } finally {
        btn.disabled = false;
        btn.innerText = "✅ Сохранить приёмку";
      }
    }

    initMonths();
    loadData();
  </script>
</body>
</html>
